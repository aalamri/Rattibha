<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rattibha · Become a Planner</title>
<link rel="icon" type="image/svg+xml" href="../../assets/app-icon.png">
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: #ECE7F2; -webkit-font-smoothing: antialiased; overflow: hidden; }
  i[class^="ph"], i[class*=" ph"] { line-height: 1; display: inline-block; }
  #app { width: 1320px; height: 860px; background: #FCFAFE; display: flex; overflow: hidden;
    border-radius: 16px; box-shadow: 0 30px 80px -30px rgba(43,34,51,0.5); }
  #stageWrap { width: 100%; height: 100%; display: grid; place-items: center; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #DCD0E4; border-radius: 8px; }
</style>
</head>
<body>
<div id="stageWrap"><div id="stage"><div id="app"><div id="root"></div></div></div></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="dash.jsx"></script>
<script type="text/babel" src="onboarding.jsx"></script>

<script type="text/babel">
ReactDOM.createRoot(document.getElementById('root')).render(<OnboardingWizard />);
function fit() {
  const s = Math.min(window.innerWidth / 1320, window.innerHeight / 860, 1);
  const stage = document.getElementById('stage');
  stage.style.transform = `scale(${s})`;
  stage.style.transformOrigin = 'center center';
}
window.addEventListener('resize', fit);
setTimeout(fit, 40);
</script>
</body>
</html>
